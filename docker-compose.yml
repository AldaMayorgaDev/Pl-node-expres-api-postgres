version: '3.3'
services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_DB=db-tienda
      - POSTGRES_USER=adminInfo
      - POSTGRES_PASSWORD=admin1234
    ports:
      - 5435:5432
    volumes:
      - ./db_postgres:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@samg.mail.com
      - PGADMIN_DEFAULT_PASSWORD=root
    ports:
      - 5050:80

